---
all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: "{{ lookup('env', 'ISOKO_SSH_KEY') | default('~/.ssh/isoko-key', true) }}"
  children:
    bastion:
      hosts:
        isoko-bastion:
          ansible_host: "{{ lookup('env', 'BASTION_PUBLIC_IP') | default('REPLACE_BASTION_PUBLIC_IP', true) }}"
    app:
      hosts:
        isoko-app:
          ansible_host: "{{ lookup('env', 'APP_PRIVATE_IP') | default('REPLACE_APP_PRIVATE_IP', true) }}"
      vars:
        ansible_ssh_common_args: >-
          -o ProxyCommand="ssh -W %h:%p -q -i {{ ansible_ssh_private_key_file }}
          -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
          {{ ansible_user }}@{{ hostvars['isoko-bastion'].ansible_host }}"
          -o StrictHostKeyChecking=accept-new
