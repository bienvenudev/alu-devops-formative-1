---
- name: Install the firewall, brute-force protection and automatic updates
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
      - openssh-server
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Allow SSH through the firewall
  community.general.ufw:
    rule: allow
    port: "{{ security_ssh_port }}"
    proto: tcp

- name: Allow the application port through the firewall
  community.general.ufw:
    rule: allow
    port: "{{ security_app_port }}"
    proto: tcp

- name: Deny all other incoming traffic and enable the firewall
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming

- name: Harden the SSH server
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      MaxAuthTries 3
      X11Forwarding no
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Start fail2ban and enable it at boot
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
